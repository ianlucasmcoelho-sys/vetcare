name: VetCare CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  management-check:
    name: Independent VetCare Management
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: management
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: management/package-lock.json
      - run: npm ci
      - run: npm test

  backend-check:
    name: Backend Syntax & Health Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: npm --prefix backend ci

      - name: Check Backend Syntax & ESM Imports
        run: node --check backend/src/index.js

      - name: Run Backend Regression Tests
        run: node --test backend/tests/*.test.js

      - name: Run Desktop Client Tests
        run: node --test desktop/tests/*.test.cjs

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm --prefix frontend ci

      - name: Build Frontend
        run: npm --prefix frontend run build

      - name: Run Frontend Regression Tests
        run: node --test frontend/tests/*.test.js
